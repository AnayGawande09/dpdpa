<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DPDP Compliance Analyzer</title>
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <div class="container">
    <h1>DPDP Compliance Analyzer</h1>
    <p class="subtitle">Upload a dataset to check for potential compliance gaps.</p>

    <div id="login-section" class="card">
      <h2>Log in</h2>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required value="admin@example.com" />
        <label for="password">Password</label>
        <input type="password" id="password" required value="DemoPass123!" />
        <button type="submit">Log in</button>
      </form>
      <p id="login-error" class="error hidden"></p>
    </div>

    <div id="upload-section" class="card hidden">
      <h2>Connect a data source</h2>
      <form id="upload-form">
        <label for="file-input">Upload file (csv, json, txt, xlsx)</label>
        <input type="file" id="file-input" accept=".csv,.json,.txt,.xlsx" required />
        <button type="submit">Upload</button>
      </form>
      <button class="secondary" disabled title="Coming soon">Connect live source (coming soon)</button>

      <div id="upload-result" class="hidden">
        <p><strong>File:</strong> <span id="result-filename"></span></p>
        <p><strong>Row count:</strong> <span id="result-rowcount"></span></p>
        <p><strong>Columns:</strong> <span id="result-columns"></span></p>
      </div>
      <p id="upload-error" class="error hidden"></p>
    </div>

    <div id="context-section" class="card hidden">
      <h2>Processing context</h2>
      <p class="subtitle">Required before scanning — how is this data actually used?</p>
      <form id="context-form">
        <label for="purpose">Purpose</label>
        <select id="purpose">
          <option>Marketing</option>
          <option>Analytics</option>
          <option>Customer Support</option>
          <option>Legal/Compliance</option>
          <option>Other</option>
        </select>

        <label for="consent-status">Consent status</label>
        <select id="consent-status">
          <option>Available</option>
          <option>Not available</option>
          <option>Unknown</option>
        </select>

        <label for="retention-value">Retention period</label>
        <div style="display:flex; gap:8px;">
          <input type="number" id="retention-value" min="0" value="5" style="width:80px;" />
          <select id="retention-unit" style="width:auto;">
            <option>days</option>
            <option>months</option>
            <option>years</option>
          </select>
        </div>

        <label for="access-scope">Access scope (who/what can access this data)</label>
        <input type="text" id="access-scope" placeholder="e.g. Marketing, Sales" />

        <label><input type="checkbox" id="encryption-enabled" /> Encryption enabled</label>
        <label><input type="checkbox" id="access-control-enabled" /> Access control enabled</label>

        <label for="notice-status">Notice status</label>
        <select id="notice-status">
          <option>Available</option>
          <option>Missing</option>
        </select>

        <button type="submit">Save context</button>
      </form>
      <p id="context-error" class="error hidden"></p>
      <p id="context-success" class="success hidden"></p>

      <button id="scan-button" disabled>Run Compliance Scan</button>
      <p id="scan-status" class="success hidden"></p>
      <p id="dashboard-link" class="hidden"><a id="dashboard-link-anchor" href="#">View Dashboard →</a></p>
    </div>
  </div>

  <script src="static/js/app.js"></script>
</body>
</html>
